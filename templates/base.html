<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Undercover{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="masthead">
  <div class="mark">
    <div class="mark-badge">U/C</div>
    <div class="mark-text">Dossier<b>Undercover</b></div>
  </div>
  <div class="case-tag">{% block casetag %}NEW CASE{% endblock %}</div>
</div>
<div class="perforation"></div>
<div class="wrap">
  {% block content %}{% endblock %}
</div>
</body>
</html>
